databricks_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev: &base
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'dev') }}"
      schema: default
      threads: 4
    hml:
      <<: *base
      catalog: hml
    prod:
      <<: *base
      catalog: prod
