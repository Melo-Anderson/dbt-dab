resources:
  jobs:
    dbt_medallion_job:
      name: dbt_medallion_job
      tasks:
        - task_key: dbt_build
          dbt_task:
            project_directory: ../dbt_project
            commands:
              - dbt build
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: default
          environment_key: dbt_env
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.8,<2.0
